services:
  - type: web
    name: educonnect-backend
    env: python
    branch: backend
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt && alembic upgrade head && python -m seeds.seed"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://educonnect-frontend.onrender.com"]'

  - type: web
    name: educonnect-frontend
    env: static
    branch: backend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://be-educonnect-tipp.onrender.com"

