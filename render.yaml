services:
  - type: web
    name: educonnect-backend
    env: python
    branch: backend
    buildCommand: "cd backend && pip install -r requirements.txt && alembic upgrade head && python -m seeds.seed"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: educonnect-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: educonnect-frontend
    env: static
    branch: backend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://be-educonnect-tipp.onrender.com"

databases:
  - name: educonnect-db
    plan: free
    databaseName: educonnect
    user: admin

