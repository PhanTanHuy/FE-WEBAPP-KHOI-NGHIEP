services:
  - type: web
    name: educonnect-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: educonnect-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: educonnect-frontend
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        value: "https://educonnect-backend.onrender.com"

databases:
  - name: educonnect-db
    plan: free
    databaseName: educonnect
    user: admin
